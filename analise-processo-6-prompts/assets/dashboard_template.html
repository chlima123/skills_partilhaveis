<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITULO__</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151a23; --panel2:#1c2330; --line:#2a3445;
    --ink:#e9edf3; --dim:#9aa6b8; --muted:#6e7a8d;
    --gold:#c9a455; --gold-soft:#e0b96f; --vrf:#e0776b; --ok:#5fb98a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.65}
  header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
         padding:16px 26px 14px;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
  .brand{flex:1;min-width:260px}
  .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--gold);font-weight:700}
  header h1{margin:4px 0 3px;font-family:var(--serif);font-size:22px;
            font-weight:600;letter-spacing:.01em}
  .sub{font-size:12.5px;color:var(--muted)}
  .tools{display:flex;gap:8px;align-items:center}
  #search{width:290px;max-width:46vw;background:var(--panel2);border:1px solid var(--line);
          color:var(--ink);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--gold)}
  .tools button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
                border-radius:8px;padding:9px 13px;font-size:13.5px;cursor:pointer}
  .tools button:hover{border-color:var(--gold);color:var(--gold-soft)}
  #navhits{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
  .notice{background:#1a1410;border-bottom:1px solid #3a2c1c;color:#d9c39a;
          font-size:12.5px;padding:9px 26px;line-height:1.5}
  .wrap{display:flex;align-items:flex-start}
  nav#nav{width:270px;flex:0 0 270px;position:sticky;top:118px;align-self:flex-start;
          max-height:calc(100vh - 130px);overflow-y:auto;padding:20px 14px 40px;
          border-right:1px solid var(--line)}
  .nav-link{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;
            color:var(--dim);text-decoration:none;font-size:13.5px;cursor:pointer;
            border:1px solid transparent}
  .nav-link .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--panel2);
               display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
  .nav-link:hover{background:var(--panel);color:var(--ink)}
  .nav-link.active{background:var(--panel2);color:var(--gold);border-color:#313d52}
  .nav-link.active .n{background:var(--gold);color:#1b1405}
  main{flex:1;min-width:0;padding:26px 40px 80px;max-width:920px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
        border-radius:12px;padding:26px 30px;margin-bottom:26px;scroll-margin-top:130px}
  .card.active{border-left-color:var(--gold);box-shadow:0 0 0 1px #2f3a4d inset}
  .card.hidden{display:none}
  .card-head{display:flex;gap:14px;align-items:center;
             border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
  .badge{flex:0 0 40px;height:40px;border-radius:10px;background:var(--panel2);
         border:1px solid #313d52;display:grid;place-items:center;
         font-family:var(--serif);font-size:20px;color:var(--gold)}
  .card-head h2{margin:0;font-size:17px;font-weight:600}
  .card-head .kicker{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
  .card-body{font-family:var(--serif);font-size:15.5px;line-height:1.8;color:#dfe5ee}
  .card-body h2,.card-body h3,.card-body h4{font-family:var(--sans);color:var(--gold-soft);
        margin:22px 0 8px;font-size:14.5px;letter-spacing:.02em}
  .card-body h1{font-size:17px;color:var(--ink)}
  .card-body p{margin:9px 0}
  .card-body ul,.card-body ol{margin:9px 0 9px 6px;padding-left:20px}
  .card-body li{margin:4px 0}
  .card-body blockquote{border-left:3px solid var(--gold);margin:12px 0;padding:6px 16px;
        background:#1a1f2b;color:var(--dim);font-style:italic}
  .card-body code{font-family:var(--mono);font-size:13px;background:var(--panel2);
        padding:1px 6px;border-radius:5px;color:var(--gold-soft)}
  .card-body pre{background:#0b0f15;border:1px solid var(--line);border-radius:8px;
        padding:14px 16px;overflow-x:auto;font-size:13px}
  .card-body pre code{background:none;padding:0}
  .card-body table{width:100%;border-collapse:collapse;margin:14px 0;font-family:var(--sans);font-size:13.5px}
  .card-body th,.card-body td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  .card-body th{background:var(--panel2);color:var(--gold-soft)}
  .card-body hr{border:none;border-top:1px solid var(--line);margin:18px 0}
  .vrf{color:var(--vrf);font-weight:700;background:rgba(224,119,107,.12);
       border:1px solid rgba(224,119,107,.35);border-radius:5px;padding:0 5px;font-size:12.5px}
  mark.hl{background:rgba(201,164,85,.28);color:var(--ink);border-radius:3px}
  #hud{position:fixed;right:20px;bottom:18px;z-index:30;background:var(--panel2);
       border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:12.5px;
       color:var(--muted)}
  #hud b{color:var(--gold)}
  footer{border-top:1px solid var(--line);padding:18px 26px;font-size:12px;color:var(--muted);
         line-height:1.7}
  footer a{color:var(--gold);text-decoration:none}
  kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);
      border-radius:5px;padding:1px 6px;color:var(--dim)}
  @media(max-width:920px){
    nav#nav{position:static;width:auto;flex:1 1 auto;max-height:none;border-right:none;
            border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap}
    .wrap{flex-direction:column}
    main{padding:20px 16px 60px}
    #search{width:200px}
  }
  @media print{
    header,nav#nav,#hud,.tools,.notice{display:none!important}
    body{background:#fff;color:#000}
    .card{border:1px solid #ccc;page-break-inside:avoid;background:#fff;color:#000}
    .card-body,.card-body p{color:#000}
    .card.hidden{display:block}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="kicker">Análise de processo — 6 prompts encadeados</div>
    <h1>__TITULO__</h1>
    <div class="sub">__META__</div>
  </div>
  <div class="tools">
    <input id="search" type="search" placeholder="Buscar no relatório…  ( / )" autocomplete="off">
    <span id="navhits"></span>
    <button id="btnPrev" title="Etapa anterior (←)">‹</button>
    <button id="btnNext" title="Próxima etapa (→)">›</button>
    <button id="btnPrint" title="Imprimir / salvar PDF">Imprimir</button>
  </div>
</header>
<div class="notice">__AVISO__</div>
<div class="wrap">
  <nav id="nav" aria-label="Etapas"></nav>
  <main id="cards"></main>
</div>
<div id="hud">Etapa <b id="hudn">1</b> / <b id="hudt">6</b></div>
<footer>
  __CREDITO__ <span class="dot">·</span> gerado em __DATA__<br>
  Navegação: <kbd>←</kbd> <kbd>→</kbd> (ou <kbd>↑</kbd> <kbd>↓</kbd>) percorrem as etapas ·
  <kbd>/</kbd> foca a busca · <kbd>Esc</kbd> limpa. Confira no original toda informação decisiva.
</footer>
<script>
const SECTIONS = __SECTIONS_JSON__;
const cardsEl = document.getElementById('cards');
const navEl   = document.getElementById('nav');
const hudN    = document.getElementById('hudn');
let activeIdx = 0;

SECTIONS.forEach((s, i) => {
  const c = document.createElement('section');
  c.className = 'card'; c.id = 'etapa-' + s.n; c.dataset.i = i;
  c.innerHTML =
    '<div class="card-head"><span class="badge">' + s.n + '</span>' +
    '<h2><span class="kicker">' + s.kicker + '</span>' + s.label + '</h2></div>' +
    '<div class="card-body">' + s.html + '</div>';
  cardsEl.appendChild(c);

  const a = document.createElement('a');
  a.href = '#etapa-' + s.n; a.className = 'nav-link'; a.dataset.i = i;
  a.innerHTML = '<span class="n">' + s.n + '</span><span class="t">' + s.label + '</span>';
  a.addEventListener('click', ev => { ev.preventDefault(); setActive(i); });
  navEl.appendChild(a);
});

document.getElementById('hudt').textContent = SECTIONS.length;

function setActive(i){
  if(i < 0 || i >= SECTIONS.length) return;
  activeIdx = i;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', +c.dataset.i === i));
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', +a.dataset.i === i));
  hudN.textContent = i + 1;
  const c = document.querySelector('.card[data-i="' + i + '"]');
  if(c) c.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnPrev').addEventListener('click', () => setActive(activeIdx - 1));
document.getElementById('btnNext').addEventListener('click', () => setActive(activeIdx + 1));
document.getElementById('btnPrint').addEventListener('click', () => window.print());

/* ---------- busca com destaque ---------- */
const searchInput = document.getElementById('search');
const navHits = document.getElementById('navhits');

function clearHL(){
  document.querySelectorAll('mark.hl').forEach(m => {
    const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
  });
  document.querySelectorAll('.card').forEach(c => c.classList.remove('hidden'));
}

function hl(root, rx){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while((n = walker.nextNode())){
    if(n.nodeValue && rx.test(n.nodeValue)){ rx.lastIndex = 0; nodes.push(n); }
    rx.lastIndex = 0;
  }
  nodes.forEach(node => {
    const s = node.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; rx.lastIndex = 0;
    while((m = rx.exec(s)) !== null){
      if(m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const mk = document.createElement('mark'); mk.className = 'hl'; mk.textContent = m[0];
      frag.appendChild(mk); last = m.index + m[0].length;
      if(m[0].length === 0) rx.lastIndex++;
    }
    if(last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function doSearch(q){
  q = (q || '').trim();
  clearHL();
  if(q.length < 2){ navHits.textContent = ''; return; }
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  let hits = 0, cards = 0;
  document.querySelectorAll('.card').forEach(c => {
    const body = c.querySelector('.card-body');
    const count = (body.textContent.match(rx) || []).length;
    rx.lastIndex = 0;
    if(count){ hits += count; cards++; hl(body, rx); }
    else c.classList.add('hidden');
  });
  navHits.textContent = cards ? (hits + ' em ' + cards + ' etapa(s)') : 'nada';
  const first = document.querySelector('.card:not(.hidden)');
  if(first) first.scrollIntoView({behavior:'smooth', block:'start'});
}

let tmr;
searchInput.addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => doSearch(e.target.value), 140); });

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  if(e.target.id === 'search'){
    if(e.key === 'Escape'){ e.target.value = ''; doSearch(''); e.target.blur(); }
    return;
  }
  if(e.key === '/'){ e.preventDefault(); searchInput.focus(); return; }
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); setActive(Math.min(activeIdx + 1, SECTIONS.length - 1)); }
  if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp'){   e.preventDefault(); setActive(Math.max(activeIdx - 1, 0)); }
});

setActive(0);
</script>
</body>
</html>
